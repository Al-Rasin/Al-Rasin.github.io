name: portfolio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/avatar.jpg

  # Latin-only subsets (~180 KB total) keep the download small.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-400.otf
          weight: 400
        - asset: assets/fonts/Geist-500.otf
          weight: 500
        - asset: assets/fonts/Geist-600.otf
          weight: 600
