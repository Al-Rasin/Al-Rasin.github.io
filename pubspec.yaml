name: portfolio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/avatar.jpg
    - assets/images/apps/
    - assets/images/projects/

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-400.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-500.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-600.ttf
          weight: 600
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage.ttf
    - family: PlexMono
      fonts:
        - asset: assets/fonts/PlexMono-400.ttf
          weight: 400
